server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent port 3000 leaking into redirects behind reverse proxies (Cloudflare/Coolify/Traefik)
    port_in_redirect off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Clean URLs fallback
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    error_page 404 /index.html;
}
